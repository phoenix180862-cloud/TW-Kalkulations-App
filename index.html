<style>
:root{
  --bg-primary:#0f1923; --bg-secondary:#1a2a3c; --bg-tertiary:#223448;
  --bg-card:#2a3a50; --bg-hover:#324560;
  --accent-red:#c41e1e; --accent-red-light:#e63535;
  --accent-blue:#4da6ff; --text-primary:#e8ecf1; --text-secondary:#b0c0d4;
  --text-white:#f0f2f5; --text-light:#b8c4d4; --text-muted:#8a9ab4;
  --border-color:#2e4562; --border-subtle:#243a52; --success:#27ae60;
  --radius-sm:6px; --radius-md:12px; --radius-lg:20px;
  --modul-grad:linear-gradient(135deg,#1E88E5,#1565C0);
  --modul-grad-active:linear-gradient(135deg,#2f9bf0,#1b6fd6);
  --modul-shadow:rgba(30,136,229,0.30);
  --conn-grad:linear-gradient(135deg,#c8893a,#9a6420);
  --conn-shadow:rgba(200,137,58,0.30);
  --conn-on-grad:linear-gradient(135deg,#2ecc71,#1e9e54);
  --conn-on-shadow:rgba(46,204,113,0.34);
  --red-grad:linear-gradient(135deg,#e63535,#c41e1e);
  --red-shadow:rgba(196,30,30,0.32);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Source Sans 3',-apple-system,sans-serif;background:var(--bg-primary);color:var(--text-white);-webkit-font-smoothing:antialiased;min-height:100vh;}
.page-container{max-width:560px;margin:0 auto;padding:28px 16px 24px;min-height:100vh;display:flex;flex-direction:column;}

/* ===== WORTMARKEN-LOGO (1:1 aus tw-design.css) ===== */
.logo-container{display:inline-flex;flex-direction:column;align-items:flex-start;user-select:none;}
.logo-thomas-row{display:flex;align-items:baseline;margin-bottom:-18px;padding-left:1px;align-self:flex-start;position:relative;z-index:2;}
.logo-thomas-text{font-family:'Source Sans 3',serif;font-style:italic;font-weight:700;color:var(--accent-red);font-size:14.5px;letter-spacing:0.3px;}
.logo-word-row{display:flex;align-items:baseline;font-family:'Oswald',sans-serif;font-weight:700;color:var(--text-white);line-height:1;}
.logo-w{font-size:62px;}
.logo-i-wrap{position:relative;font-size:62px;display:inline-block;}
.logo-i-wrap .logo-i-char{font-size:62px;}
.logo-i-dot{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:10px;height:10px;background:var(--accent-red);}
.logo-LL{font-size:84px;letter-spacing:1px;line-height:0.75;}
.logo-wacher{font-size:62px;}
.logo-subtitle-row{display:flex;justify-content:flex-end;width:100%;margin-top:1px;}
.logo-subtitle-text{font-family:'Source Sans 3',sans-serif;font-weight:600;color:var(--accent-red);font-size:14.5px;letter-spacing:2.5px;}

.head{text-align:center;margin-bottom:24px;display:flex;flex-direction:column;align-items:center;}
.head-logo-scale{transform:scale(0.62);transform-origin:center;margin-bottom:-6px;}
.head-title{margin-top:12px;font-size:17px;font-weight:700;color:var(--text-white);font-family:'Oswald',sans-serif;letter-spacing:0.5px;}
.head-sub{font-size:11px;color:var(--text-muted);margin-top:4px;letter-spacing:2px;text-transform:uppercase;font-family:'Oswald',sans-serif;font-weight:500;}

/* ===== EINHEITLICHE BUTTONS (alle gleiche Farbe; aktiv = heller + leicht größer) ===== */
.tw-list{display:flex;flex-direction:column;gap:10px;}
.tw-btn{width:100%;padding:13px 15px;border-radius:var(--radius-lg);border:1px solid rgba(255,255,255,0.10);cursor:pointer;
  display:flex;align-items:center;gap:12px;text-align:left;transition:all .22s ease;position:relative;overflow:hidden;
  background:var(--modul-grad);color:#fff;box-shadow:0 6px 20px var(--modul-shadow);font-family:inherit;}
.tw-btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(30,136,229,0.40);}
.tw-btn:active{transform:translateY(0);}
.tw-btn.is-active{background:var(--modul-grad-active);transform:scale(1.02);box-shadow:0 10px 30px rgba(47,155,240,0.50);border-color:rgba(255,255,255,0.35);}
.conn-row{display:flex;gap:10px;}
.conn-row .tw-btn{flex:1;flex-direction:column;align-items:center;text-align:center;gap:7px;padding:14px 10px;}
.conn-row .tw-ico{width:30px;height:30px;}
.conn-row .tw-txt{flex:none;}
.conn-row .tw-name{margin-bottom:3px;}
.conn-row .tw-desc{font-size:10px;line-height:1.35;}
.conn-row .tw-right{margin-top:8px;font-size:11px;justify-content:center;}
.tw-btn.conn{background:var(--conn-grad);box-shadow:0 6px 20px var(--conn-shadow);}
.tw-btn.conn:hover{box-shadow:0 10px 26px rgba(200,137,58,0.42);}
.tw-btn.conn.is-active{background:var(--conn-on-grad);box-shadow:0 10px 30px var(--conn-on-shadow);transform:scale(1.02);border-color:rgba(255,255,255,0.4);}
.tw-ico{flex-shrink:0;display:flex;align-items:center;justify-content:center;width:34px;height:34px;}
.tw-txt{flex:1;}
.tw-name{font-size:14px;font-weight:600;margin-bottom:2px;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.5px;}
.tw-desc{font-size:11px;opacity:.88;line-height:1.4;}
.tw-right{font-size:13px;font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;opacity:.92;display:flex;align-items:center;gap:6px;}
.tw-statusdot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,0.55);display:inline-block;}
.tw-btn.is-active .tw-statusdot{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,0.25);}
.tw-arrow{font-size:16px;opacity:.7;}
.hidden-input{display:none;}

/* Schlüssel-Eingabe (klappt unter KI-Button auf) */
.key-box{margin-top:-2px;background:var(--bg-secondary);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:13px 14px;}
.key-box label{display:block;font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-family:'Oswald',sans-serif;}
.key-box input{width:100%;padding:9px 11px;border:1px solid var(--border-color);border-radius:8px;background:var(--bg-tertiary);color:var(--text-primary);font-size:13px;font-family:'Source Sans 3',sans-serif;}
.key-box input:focus{outline:none;border-color:var(--accent-blue);box-shadow:0 0 0 3px rgba(77,166,255,0.14);}
.key-box .hint{font-size:11px;color:var(--text-muted);margin-top:7px;line-height:1.45;}

.weiter-wrap{margin-top:18px;}
.weiter-btn{width:100%;padding:14px;border:none;border-radius:var(--radius-lg);cursor:pointer;font-family:'Oswald',sans-serif;
  font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:#fff;background:var(--red-grad);
  box-shadow:0 6px 20px var(--red-shadow);transition:all .22s ease;}
.weiter-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(196,30,30,0.48);}
.skip{display:block;width:100%;text-align:center;margin-top:12px;background:none;border:none;color:var(--text-muted);font-size:12px;cursor:pointer;font-family:'Source Sans 3',sans-serif;text-decoration:underline;}

/* ===== IMPORT-ERGEBNIS ===== */
.result-panel{margin-top:18px;background:var(--bg-secondary);border:1px solid var(--border-subtle);border-radius:var(--radius-md);overflow:hidden;}
.rp-head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;background:var(--bg-tertiary);border-bottom:1px solid var(--border-color);}
.rp-head h4{font-family:'Oswald',sans-serif;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text-white);}
.rp-head .x{background:none;border:none;color:var(--text-muted);font-size:20px;cursor:pointer;line-height:1;}
.rp-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border-color);}
.rp-stat{background:var(--bg-secondary);padding:14px 6px;text-align:center;}
.rp-stat .v{font-family:'Oswald',sans-serif;font-size:24px;font-weight:700;color:var(--accent-blue);}
.rp-stat .l{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;margin-top:3px;}
.rp-list{max-height:280px;overflow-y:auto;}
.rp-grp{font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text-secondary);padding:9px 16px;background:var(--bg-tertiary);border-top:1px solid var(--border-color);}
.rp-item{display:grid;grid-template-columns:84px 1fr 64px 56px;gap:8px;align-items:center;padding:8px 16px;border-top:1px solid var(--border-subtle);font-size:12px;}
.rp-item:hover{background:var(--bg-tertiary);}
.rp-oz{font-family:'Oswald',sans-serif;font-weight:600;color:var(--text-secondary);}
.rp-tx{color:var(--text-light);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rp-qty{text-align:right;color:var(--text-muted);}
.rp-tag{justify-self:end;font-size:9px;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.4px;padding:3px 6px;border-radius:5px;}
.tag-mat{background:rgba(196,30,30,.14);color:var(--accent-red-light);border:1px solid var(--accent-red);}
.tag-lohn{background:rgba(77,166,255,.12);color:var(--accent-blue);border:1px solid var(--accent-blue);}
.tag-bid{background:rgba(255,255,255,.06);color:var(--text-light);border:1px solid var(--border-color);}
.tag-none{background:var(--bg-tertiary);color:var(--text-muted);border:1px solid var(--border-color);}
.err-note{margin-top:14px;color:var(--accent-red-light);font-size:13px;text-align:center;}

.back-row{margin-bottom:8px;}
.back-btn{background:rgba(196,30,30,0.12);border:1px solid var(--accent-red);color:var(--accent-red-light);font-size:12px;cursor:pointer;font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:var(--radius-lg);transition:all .2s ease;}
.back-btn:hover{background:var(--red-grad);color:#fff;border-color:transparent;}
.foot{margin-top:auto;padding-top:18px;text-align:center;}
.foot .ver{display:inline-block;padding:8px 14px;background:var(--bg-secondary);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);font-size:11px;color:var(--text-muted);font-family:'Oswald',sans-serif;letter-spacing:0.5px;}
.foot .ver .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle;}
.dot-on{background:var(--success);} .dot-off{background:var(--text-muted);}

/* ===== MODUL 2: MATERIAL & ZUSCHLÄGE ===== */
.m2-section-title{font-family:'Oswald',sans-serif;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--accent-blue);margin:18px 0 10px;display:flex;align-items:center;gap:8px;}
.m2-section-title::before{content:"";width:3px;height:14px;background:var(--accent-blue);border-radius:2px;}
.dash{background:var(--bg-secondary);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:14px;}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;}
.dash-field label{display:block;font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:4px;font-family:'Oswald',sans-serif;}
.dash-inputwrap{display:flex;align-items:center;gap:6px;}
.dash-field input{flex:1;width:100%;padding:8px 10px;border:1px solid var(--border-color);border-radius:7px;background:var(--bg-tertiary);color:var(--text-primary);font-size:14px;font-family:'Oswald',sans-serif;font-weight:600;text-align:right;}
.dash-field input:focus{outline:none;border-color:var(--accent-blue);box-shadow:0 0 0 3px rgba(77,166,255,0.14);}
.dash-unit{font-size:12px;color:var(--text-muted);min-width:24px;}
.dash-vl{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;padding:9px 11px;background:var(--bg-tertiary);border-radius:8px;border:1px dashed var(--accent-blue);}
.dash-vl .k{font-size:11px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;font-family:'Oswald',sans-serif;}
.dash-vl .v{font-family:'Oswald',sans-serif;font-size:18px;font-weight:700;color:var(--accent-blue);}

.matlist{display:flex;flex-direction:column;gap:8px;}
.matrow{background:var(--bg-secondary);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:11px 12px;}
.matrow.ro{opacity:0.72;border-style:dashed;}
.matrow-top{display:flex;align-items:flex-start;gap:9px;margin-bottom:9px;}
.matrow-oz{font-family:'Oswald',sans-serif;font-weight:700;font-size:13px;color:var(--accent-blue);flex-shrink:0;min-width:74px;}
.matrow-kurz{flex:1;font-size:12.5px;color:var(--text-light);line-height:1.35;}
.matrow-qty{font-size:11px;color:var(--text-muted);white-space:nowrap;flex-shrink:0;font-family:'Oswald',sans-serif;}
.matrow-fields{display:grid;grid-template-columns:1fr 1fr 88px;gap:8px;}
.mf label{display:block;font-size:9px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:3px;font-family:'Oswald',sans-serif;}
.mf input{width:100%;padding:7px 9px;border:1px solid var(--border-color);border-radius:7px;background:var(--bg-tertiary);color:var(--text-primary);font-size:13px;font-family:'Source Sans 3',sans-serif;}
.mf input:focus{outline:none;border-color:var(--accent-blue);box-shadow:0 0 0 2px rgba(77,166,255,0.14);}
.mf.ek input{font-family:'Oswald',sans-serif;font-weight:600;text-align:right;}
.matrow-calc{display:flex;justify-content:flex-end;gap:16px;margin-top:9px;padding-top:9px;border-top:1px solid var(--border-subtle);}
.matrow-calc .c{font-size:11px;color:var(--text-muted);font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.5px;}
.matrow-calc .c b{display:block;font-size:15px;color:var(--text-white);font-weight:700;margin-top:1px;}
.matrow-calc .c.gp b{color:var(--accent-blue);}
.matrow-badge{display:inline-block;font-size:9px;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.4px;padding:2px 6px;border-radius:5px;margin-left:7px;vertical-align:middle;}
.summary-bar{position:sticky;bottom:0;margin-top:14px;background:linear-gradient(135deg,#1E88E5,#1565C0);border-radius:var(--radius-md);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 -4px 16px rgba(0,0,0,0.3);}
.summary-bar .lbl{font-family:'Oswald',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,0.85);}
.summary-bar .sum{font-family:'Oswald',sans-serif;font-size:26px;font-weight:700;color:#fff;}
.m2-empty{text-align:center;color:var(--text-muted);font-size:13px;padding:30px 16px;line-height:1.6;}
.m2-empty .big{font-size:15px;color:var(--text-light);margin-bottom:6px;display:block;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.5px;}


/* ===== MODUL 3: KALKULATION & SZENARIEN ===== */
.scen-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px;}
.scen-card{background:var(--bg-secondary);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:14px 12px;text-align:center;position:relative;}
.scen-card.s1{border-top:3px solid #4da6ff;}
.scen-card.s2{border-top:3px solid #f39c12;}
.scen-card.s3{border-top:3px solid #2ecc71;}
.scen-card .sc-lbl{font-family:'Oswald',sans-serif;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-muted);margin-bottom:8px;line-height:1.3;min-height:26px;display:flex;align-items:center;justify-content:center;}
.scen-card .sc-val{font-family:'Oswald',sans-serif;font-size:21px;font-weight:700;color:var(--text-white);line-height:1;}
.scen-card.s1 .sc-val{color:#4da6ff;}
.scen-card.s2 .sc-val{color:#f39c12;}
.scen-card.s3 .sc-val{color:#2ecc71;}
.scen-card .sc-sub{font-size:10px;color:var(--text-muted);margin-top:6px;line-height:1.35;}
.scen-delta{font-size:11px;font-family:'Oswald',sans-serif;font-weight:600;margin-top:5px;}
.scen-delta.up{color:#2ecc71;} .scen-delta.flat{color:var(--text-muted);}

.kalk-hint{background:rgba(243,156,18,0.10);border:1px solid #f39c12;border-radius:var(--radius-md);padding:11px 13px;margin:14px 0;font-size:12px;color:var(--text-light);line-height:1.5;}

.cd-bidder{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-radius:7px;margin-bottom:4px;font-size:12px;background:var(--bg-secondary);}

/* Erfassung */

function txt(node, sel){const e=node.querySelector(sel);return e?e.textContent.trim():"";}
function collectText(node, tag){const out=[];node.querySelectorAll(tag+" span, "+tag).forEach(s=>{if(s.children.length===0){const t=s.textContent.trim();if(t)out.push(t);}});return out.join(" ").replace(/\s+/g," ").trim();}
function classify(lang, hasBid){const t=(lang||"").toLowerCase();if(hasBid)return "bid";if(/(bodenbelag|bekleidung|fliesen|platten|klinker|sockel|stufen|fensterbank)/.test(t))return "mat";if(/(reinigen|bürsten|voranstrich|spachteln|abdichtung|randfuge|anschlussfuge|stundenlohn)/.test(t))return "lohn";return "none";}
function parseX83(xmlString){
  const dom=new DOMParser().parseFromString(xmlString,"application/xml");
  if(dom.querySelector("parsererror"))throw new Error("XML konnte nicht gelesen werden.");
  const prj=txt(dom,"NamePrj")||txt(dom,"LblPrj")||"(ohne Projektname)";
  const groups=[];let itemCount=0,upbkdn=0,bidder=0;
  dom.querySelectorAll("BoQCtgy").forEach(ctgy=>{
    const lbl=collectText(ctgy,"LblTx")||ctgy.getAttribute("RNoPart")||"Gruppe";
    const items=[];
    ctgy.querySelectorAll("Itemlist > Item").forEach(it=>{
      if(it.closest("BoQCtgy")!==ctgy)return;
      const oz=it.getAttribute("RNoPart")||"";
      const qty=txt(it,"Qty");const qu=txt(it,"QU");
      const kurz=collectText(it,"TextOutlTxt")||collectText(it,"OutlTxt")||collectText(it,"OutlineText");
      const lang=collectText(it,"DetailTxt");
      const hasUP=!!Array.from(it.children).find(c=>c.tagName==="UPBkdn"&&c.textContent.trim()==="Yes");
      const hasBid=!!it.querySelector('TextComplement[Kind="Bidder"]');
      const isLump=!!Array.from(it.children).find(c=>c.tagName==="LumpSumItem"&&c.textContent.trim()==="Yes");
      const provEl=Array.from(it.children).find(c=>c.tagName==="Provis");
      const isProvis=provEl && /WithoutTotal/i.test(provEl.textContent);
      if(hasUP)upbkdn++;if(hasBid)bidder++;
      items.push({oz,qty,qu,kurz:kurz||lang.slice(0,80),typ:classify(lang,hasBid),hasUP,hasBid,isLump,isProvis});
      itemCount++;
    });
    if(items.length)groups.push({lbl,items});
  });
  // flache Positionsliste fuer das Material-Modul (LV-Reihenfolge bleibt erhalten)
  const positionen=[];
  groups.forEach(g=>g.items.forEach(it=>{
    positionen.push({
      oz:it.oz, kurz:it.kurz, qty:parseFloat((it.qty||"0").replace(",","."))||0,
      qu:it.qu, typ:it.typ, gruppe:g.lbl,
      format:"", fabrikat:"", ek:0, zeit:defaultZeit(it.qu,it.typ),
      erwMenge:null, spreizPct:0,
      hasUP:it.hasUP, hasBid:it.hasBid, isLump:it.isLump, isProvis:it.isProvis
    });
  }));
  return {prj,groups,itemCount,upbkdn,bidder,groupCount:groups.length,positionen,xml:xmlString};
}

// Default-Zeitansatz (h je Einheit) als sinnvoller Startwert - vom Nutzer ueberschreibbar
function defaultZeit(qu,typ){
  const u=(qu||"").toLowerCase();
  if(typ==="lohn") return 0;
  if(u==="m2") return 0.55;
  if(u==="m") return 0.25;
  if(u==="st") return 0.4;
  if(u==="psch"||u==="h") return 0;
  return 0;
}

// ============ KALKULATIONS-KERN (dokumentierte EP/GP-Formel) ============
// EP = Verrechnungslohn * Zeitansatz
//    + (Fliese + Verlegematerial) * (1 + Materialaufschlag%)
//    + Geraete * (1 + Geraeteaufschlag%)
// Verrechnungslohn ergibt sich aus Mittellohn * EFB-Lohnfaktor.
function verrechnungslohn(mittellohn, lohnZuschlag){
  return mittellohn * (1 + lohnZuschlag/100);
}
function calcEP(pos, z){
  const vl = verrechnungslohn(z.mittellohn, z.lohnZuschlag);
  const lohn = vl * (pos.zeit||0);
  const material = (pos.ek||0) * (1 + z.materialZuschlag/100);
  // Geraete sind im schlanken Modell pro Position 0 (kommt ueber Zuschlag); Platzhalter fuer spaeter
  return lohn + material;
}
function fmtEUR(n){
  if(!isFinite(n)) n=0;
  return n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
}

// ============ SEITE 4: KALKULATION & 3-SZENARIEN ============
// Szenario 1 (LV):        Summe = Σ LV-Menge × EP
// Szenario 2 (Erwartung): Summe = Σ erwartete Menge × EP   (zeigt wahrscheinl. Schlussrechnung)
// Szenario 3 (Spreizung): Angebotssumme bleibt = Szenario 1, aber EP werden umverteilt:
//   Positionen mit erwartetem Mengen-PLUS bekommen höheren EP, andere niedriger,
//   so dass die Angebotssumme (LV-Massen) IDENTISCH bleibt -> erwarteter Betrag steigt.
function KalkulationScreen({lv,setLv,zuschlag,drive,ki,onBack,onOpenExport}){
  if(!lv || !lv.positionen){
    return (
      <div className="page-container">
        <div className="back-row"><button className="back-btn" onClick={onBack}>{'\u2190'} Modul wählen</button></div>
        <div className="head"><div className="head-logo-scale"><FirmenLogo/></div>
          <div className="head-title">Kalkulation</div><div className="head-sub">Kein LV geladen</div></div>
        <div className="m2-empty"><span className="big">Erst importieren</span>
          Bitte zuerst ein LV einlesen und in „Material" bepreisen.</div>
      </div>
    );
  }

  const [spreizStaerke,setSpreizStaerke]=useState(0); // 0..100 % globaler Hebel

  function setErw(i,wert){
    const ps=lv.positionen.slice();
    const v=String(wert).trim();
    ps[i]={...ps[i], erwMenge: v===''? null : (parseFloat(v.replace(',','.'))||0)};
    setLv({...lv, positionen:ps});
  }
  const erwOf = pos => (pos.erwMenge==null? pos.qty : pos.erwMenge);

  // --- Basiswerte je Position ---
  const calc = lv.positionen.map(pos=>{
    const ep = pos.typ==='bid' ? 0 : calcEP(pos, zuschlag);
    return {pos, ep, lvMenge:pos.qty, erwMenge:erwOf(pos)};
  });

  // Szenario 1 + 2
  let sum1=0, sum2=0;
  calc.forEach(c=>{ if(c.pos.typ!=='bid'){ sum1 += c.lvMenge*c.ep; sum2 += c.erwMenge*c.ep; } });

  // --- Szenario 3: gewinn-neutrale EP-Spreizung ---
  // Idee: Positionen mit (erwMenge - lvMenge) > 0 = "Gewinner" -> EP rauf.
  //       Der Aufschlag wird so über die LV-Massen gegenfinanziert, dass sum1 konstant bleibt.
  // staerke 0..1 skaliert, wie aggressiv gespreizt wird.
  const k = spreizStaerke/100;
  // Positionen mit Mengenplus
  let plusBasisLV=0; // Σ (LV-Menge × EP) der Plus-Positionen
  calc.forEach(c=>{ if(c.pos.typ!=='bid' && (c.erwMenge-c.lvMenge)>0.0001){ plusBasisLV += c.lvMenge*c.ep; } });
  // Anhebung der Plus-Positionen um Faktor (1+k*0.5); Differenz wird auf Nicht-Plus verteilt
  const anhebung = k*0.5; // bis +50% EP auf Gewinnerpositionen bei vollem Hebel
  const mehrLV = plusBasisLV * anhebung; // zusätzliche LV-Summe durch Anhebung
  // Gegenfinanzierung über Nicht-Plus-Positionen (deren LV-Basis)
  let restBasisLV=0;
  calc.forEach(c=>{ if(c.pos.typ!=='bid' && (c.erwMenge-c.lvMenge)<=0.0001){ restBasisLV += c.lvMenge*c.ep; } });
  const senkung = restBasisLV>0 ? mehrLV/restBasisLV : 0; // anteilige Senkung der Rest-EP

  let sum3lv=0, sum3erw=0;
  const calc3 = calc.map(c=>{
    if(c.pos.typ==='bid') return {...c, ep3:0};
    const istPlus = (c.erwMenge-c.lvMenge)>0.0001;
    let ep3;
    if(istPlus) ep3 = c.ep*(1+anhebung);
    else ep3 = c.ep*(1-senkung);
    sum3lv += c.lvMenge*ep3;
    sum3erw += c.erwMenge*ep3;
    return {...c, ep3, istPlus};
  });

  const delta2 = sum1>0 ? ((sum2-sum1)/sum1*100) : 0;
  const delta3 = sum1>0 ? ((sum3erw-sum1)/sum1*100) : 0;
  const angebotKonstant = Math.abs(sum3lv-sum1) < 1; // Kontrolle: Angebotssumme bleibt

  return (
    <div className="page-container">
      <div className="back-row"><button className="back-btn" onClick={onBack}>{'\u2190'} Modul wählen</button></div>
      <div className="head"><div className="head-logo-scale"><FirmenLogo/></div>

      <div className="m2-section-title">3-Szenarien-Vergleich</div>
      <div className="scen-cards">
        <div className="scen-card s1">
          <div className="sc-lbl">1 · LV-Massen<br/>(Angebot)</div>
          <div className="sc-val">{fmtEUR(sum1)}</div>
          <div className="sc-sub">ausgeschriebene Mengen</div>
        </div>
        <div className="scen-card s2">
          <div className="sc-lbl">2 · Erwartete Massen</div>
          <div className="sc-val">{fmtEUR(sum2)}</div>
          <div className={"scen-delta "+(delta2>0.1?"up":"flat")}>{delta2>=0?'+':''}{delta2.toFixed(1)} %</div>
        </div>
        <div className="scen-card s3">
          <div className="sc-lbl">3 · EP-Spreizung</div>
          <div className="sc-val">{fmtEUR(sum3erw)}</div>
          <div className={"scen-delta "+(delta3>0.1?"up":"flat")}>{delta3>=0?'+':''}{delta3.toFixed(1)} %</div>
        </div>
      </div>

      <div className="kalk-hint">
        <b>So funktioniert die Spreizung:</b> Die Angebotssumme (Szenario 1) bleibt {angebotKonstant?'konstant':'nahezu konstant'} bei {fmtEUR(sum3lv)} – du gewinnst die Vergabe mit demselben Preis. Durch Anheben der EP bei Positionen mit erwartetem Mengen-Plus steigt der wahrscheinliche Schlussrechnungsbetrag. Auskömmlichkeit und Plausibilität im Blick behalten – die Einzelpreise müssen vertretbar bleiben.
      </div>

      <div className="spreiz-ctrl">
        <label>Spreizung</label>
        <input type="range" min="0" max="100" step="5" value={spreizStaerke} onChange={e=>setSpreizStaerke(parseInt(e.target.value))}/>
        <span className="val">{spreizStaerke}%</span>
      </div>

      <div className="m2-section-title">Positionen · erwartete Mengen anpassen</div>
      <div className="matlist">
        {calc3.map((c,i)=>{
          const pos=c.pos; const isBid=pos.typ==='bid';
          return (
            <div className={"krow"+(isBid?" ro":"")} key={i}>

// ============ X84-ERZEUGUNG (DOM-basiert, gemäß gaeb-mechanik.md) ============
// Arbeitet am Original-X83-DOM: Phase 83->84, EP je Item ergänzen, bei UPBkdn=Yes
// die vier Teilpreise, Bieterfelder/Bieterkopf füllen. IDs/Mengen/Texte unverändert.
function buildX84(lv, zuschlag, bieter){
  const dom = new DOMParser().parseFromString(lv.xml, "application/xml");
  if(dom.querySelector("parsererror")) throw new Error("X83-DOM nicht lesbar.");
  let root = dom.documentElement;

  // EP-Lookup je Ordnungszahl
  const epOf = {};
  lv.positionen.forEach(pos=>{
    if(pos.typ!=='bid'){ epOf[pos.oz] = calcEP(pos, zuschlag); }
  });

  // pro Item ergänzen
  const items = dom.querySelectorAll("Itemlist > Item");
  items.forEach(it=>{
    const oz = it.getAttribute("RNoPart")||"";
    const ep = epOf[oz];
    if(ep==null || ep<=0) return; // Bieterfelder / unbepreist überspringen
    const qtyEl = it.querySelector(":scope > Qty");
    const qty = qtyEl ? (parseFloat((qtyEl.textContent||"0").replace(",","."))||0) : 0;

    // <UP> Einheitspreis (Punkt als Dezimaltrenner)
    let up = it.querySelector(":scope > UP");
    if(!up){ up = dom.createElementNS(root.namespaceURI, "UP"); it.appendChild(up); }
    up.textContent = ep.toFixed(2);

    // <IT> Gesamtbetrag = Menge × EP
    let itTotal = it.querySelector(":scope > IT");
    if(!itTotal){ itTotal = dom.createElementNS(root.namespaceURI, "IT"); it.appendChild(itTotal); }
    itTotal.textContent = (qty*ep).toFixed(2);

    // Bei UPBkdn=Yes: vier Teilpreise (1=Lohn,2=Material,3=Gerät,4=Sonstiges)
    const hasUP = !!Array.from(it.children).find(c=>c.tagName==="UPBkdn" && c.textContent.trim()==="Yes");
    if(hasUP){
      const pos = lv.positionen.find(p=>p.oz===oz);
      const vl = verrechnungslohn(zuschlag.mittellohn, zuschlag.lohnZuschlag);
      const lohn = pos? vl*(pos.zeit||0) : 0;
      const material = pos? (pos.ek||0)*(1+zuschlag.materialZuschlag/100) : 0;
      const geraet = 0, sonst = 0;
      let comps = it.querySelector(":scope > UPComps");
      if(!comps){ comps = dom.createElementNS(root.namespaceURI,"UPComps"); it.appendChild(comps); }
      while(comps.firstChild) comps.removeChild(comps.firstChild);
      [lohn,material,geraet,sonst].forEach(v=>{
        const c = dom.createElementNS(root.namespaceURI,"UPComp");
        c.textContent = v.toFixed(2);
        comps.appendChild(c);
      });
    }
  });

  // Bieterangaben im Award-Kopf (best effort, ohne Struktur zu brechen)
  if(bieter && bieter.name){
    let award = dom.querySelector("Award");
    if(award){
      let prcCat = award.querySelector("PrcCat");
      // Bietername als OWN-Element nur ergänzen, wenn nicht vorhanden
      if(!award.querySelector("BidderName")){
        const bn = dom.createElementNS(root.namespaceURI,"BidderName");
        bn.textContent = bieter.name;
        // ans Ende der AwardInfo oder Award hängen
        const ai = award.querySelector("AwardInfo");
        (ai||award).appendChild(bn);
      }
    }
  }

  let out = new XMLSerializer().serializeToString(dom);
  // Namespace DA83 -> DA84 (am String, da DOM-Namespace nicht zuverlaessig aenderbar)
  out = out.replace(/GAEB_DA_XML\/DA83\//g, "GAEB_DA_XML/DA84/");
  // Phase 83 -> 84 (erstes <DP>83</DP> im Award-Kopf)
  out = out.replace(/<DP>\s*83\s*<\/DP>/, "<DP>84</DP>");
  // XML-Deklaration + CRLF sicherstellen
  if(out.indexOf("<?xml")!==0) out = '<?xml version="1.0" encoding="UTF-8"?>\r\n'+out;
  out = out.replace(/\r?\n/g,"\r\n");
  return out;
}

function ExportScreen({lv,zuschlag,drive,ki,onBack}){
  const [bieterName,setBieterName]=useState("Thomas Willwacher Fliesenlegermeister e.K.");
  const [done,setDone]=useState(false);
  const [err,setErr]=useState("");

  if(!lv || !lv.positionen){
    return (
      <div className="page-container">
        <div className="back-row"><button className="back-btn" onClick={onBack}>{'\u2190'} Modul wählen</button></div>

        <div className="m2-empty"><span className="big">Erst importieren</span>
          Bitte zuerst ein LV einlesen, bepreisen und kalkulieren.</div>
      </div>
    );
  }

  const istJson = !lv.xml; // JSON-Import hat kein X83-DOM -> kein X84 moeglich

  // Vollständigkeitsprüfung: jede nicht-Provis, nicht-Pauschal, nicht-Bieter Position braucht EP>0
  const fehlend=[];
  let bepreisbar=0, bepreist=0;
  lv.positionen.forEach(pos=>{
    if(pos.typ==='bid' || pos.isProvis) return;
    bepreisbar++;
    const ep = calcEP(pos, zuschlag);
    if(ep>0) bepreist++; else fehlend.push(pos);
  });
  const vollstaendig = fehlend.length===0;

  let summe=0;
  lv.positionen.forEach(pos=>{ if(pos.typ!=='bid'){ summe += pos.qty*calcEP(pos,zuschlag); } });

  function download(){
    if(!vollstaendig || istJson) return;
    try{
      const xml = buildX84(lv, zuschlag, {name:bieterName});
      const blob = new Blob([xml], {type:"application/xml"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const base = (lv.prj||"Angebot").replace(/[^a-zA-Z0-9_\-]/g,"_").slice(0,40);
      a.href = url; a.download = base + ".X84";
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
      setDone(true); setErr("");
    }catch(ex){ setErr("Export fehlgeschlagen: "+ex.message); }
  }

  return (
    <div className="page-container">
      <div className="back-row"><button className="back-btn" onClick={onBack}>{'\u2190'} Modul wählen</button></div>
      <div className="head"><div className="head-logo-scale"><FirmenLogo/></div>

      <div className="m2-section-title">Bieterangaben</div>
      <div className="exp-bieter">
        <div className="ebrow">
          <label>Bieter / Firma</label>
          <input type="text" value={bieterName} onChange={e=>setBieterName(e.target.value)}/>
        </div>
      </div>

      <div className="m2-section-title">Vollständigkeitsprüfung</div>
      <div className="check-panel">
        <div className="check-head">Vor dem Export</div>
        <div className="check-row">
          <span className={"check-icon "+(vollstaendig?"ok":"warn")}>{vollstaendig?'\u2713':'!'}</span>
          <span className="ctxt">Bepreiste Positionen</span>
          <span className="cval">{bepreist} / {bepreisbar}</span>
        </div>
        <div className="check-row">
          <span className={"check-icon "+(istJson?"warn":"ok")}>{istJson?'!':'\u2713'}</span>
          <span className="ctxt">{istJson?'JSON-Import – kein X84 möglich (X83 nötig)':'X83-Struktur vorhanden'}</span>
          <span className="cval">{istJson?'—':'OK'}</span>
        </div>
        <div className="check-row">
          <span className="check-icon ok">{'\u2713'}</span>
          <span className="ctxt">Angebotssumme (netto)</span>
          <span className="cval">{fmtEUR(summe)}</span>
        </div>
        {!vollstaendig && (
          <div className="exp-missing">
            {fehlend.map((p,i)=><div className="mi" key={i}>○ {p.oz} – {(p.kurz||'').slice(0,46)} (kein EP)</div>)}
          </div>
        )}
      </div>

      <div className="weiter-wrap">
        <button className={"dl-btn "+((vollstaendig&&!istJson)?"ready":"blocked")} onClick={download} disabled={!vollstaendig||istJson}>
          {(vollstaendig&&!istJson)?'\u2193 X84-Datei erzeugen':'Erst alle Positionen bepreisen'}
        </button>
        {err && <div className="err-note">{err}</div>}
        {done && <div className="exp-done"><b>X84 erzeugt.</b> Die Datei wurde heruntergeladen. Bitte vor dem Versand an die Vergabestelle mit einem GAEB-Viewer gegenprüfen.</div>}
      </div>

      <div className="foot"><span className="ver">

        <span style={{margin:"0 8px",opacity:.4}}>·</span>
        <span className={"dot "+(ki?"dot-on":"dot-off")}></span>KI {ki?"aktiv":"aus"}
      </span></div>
    </div>
  );
}

// ============ PREISSPIEGEL-ANALYSE-LOGIK ============
function fmtPct(n){ if(!isFinite(n))n=0; return (n>=0?'+':'')+n.toFixed(1)+' %'; }
function parseSumme(str){
  if(typeof str==='number') return str;
  return parseFloat(String(str).replace(/\./g,'').replace(',','.').replace(/[^0-9.]/g,''))||0;
}
// Aus den Submissionen die Wettbewerber-Profile errechnen
function analysiereWettbewerb(subs){
  const profile={}; // name -> {teilnahmen, siege, abst:[], letzteSiege:[]}
  const sorted=[...subs].sort((a,b)=>(a.datum||'').localeCompare(b.datum||''));
  sorted.forEach(sub=>{
    const bg=sub.bieter.filter(b=>b.summe>0);
    if(bg.length===0) return;
    const minSumme=Math.min(...bg.map(b=>b.summe));
    const me=bg.find(b=>b.istMir);
    bg.forEach(b=>{
      if(b.istMir) return;
      if(!profile[b.name]) profile[b.name]={name:b.name,teilnahmen:0,siege:0,abstZuMir:[],reihe:[]};
      const pr=profile[b.name];
      pr.teilnahmen++;
      if(Math.abs(b.summe-minSumme)<0.01) pr.siege++;
      if(me && me.summe>0){
        // Abstand des Mitbewerbers zu MIR in %: (er - ich)/ich
        pr.abstZuMir.push((b.summe-me.summe)/me.summe*100);
      }
      pr.reihe.push({datum:sub.datum, gewonnen:Math.abs(b.summe-minSumme)<0.01});
    });
  });
  // Kennzahlen je Profil
  return Object.values(profile).map(pr=>{
    const avg=pr.abstZuMir.length? pr.abstZuMir.reduce((a,b)=>a+b,0)/pr.abstZuMir.length : null;
    // Streuung (Standardabw.) als Berechenbarkeit
    let std=null;
    if(pr.abstZuMir.length>1){
      const m=avg; const vari=pr.abstZuMir.reduce((a,b)=>a+(b-m)*(b-m),0)/pr.abstZuMir.length;
      std=Math.sqrt(vari);
    }
    // Auslastungs-Ampel: letzte 3 Teilnahmen -> wie oft gewonnen?
    const letzte=pr.reihe.slice(-3);
    const letzteSiege=letzte.filter(r=>r.gewonnen).length;
    let ampel='cold', ampelTxt='hungrig';
    if(letzteSiege>=2){ ampel='hot'; ampelTxt='ausgelastet'; }
    else if(letzteSiege===1){ ampel='busy'; ampelTxt='normal'; }
    const quote= pr.teilnahmen? pr.siege/pr.teilnahmen*100 : 0;
    return {...pr, avg, std, ampel, ampelTxt, quote};
  }).sort((a,b)=>b.teilnahmen-a.teilnahmen);
}
// Kennzahlen ueber alle Submissionen (fuer Chronik-KPIs)
function gesamtKennzahlen(subs){
  let teiln=0, siege=0, abst=[];
  const chron=[];
  const sorted=[...subs].sort((a,b)=>(b.datum||'').localeCompare(a.datum||'')); // neueste zuerst
  sorted.forEach(sub=>{
    const bg=sub.bieter.filter(b=>b.summe>0).sort((a,b)=>a.summe-b.summe);
    if(bg.length===0) return;
    const me=bg.find(b=>b.istMir);
    const minSumme=bg[0].summe;
    let rang=null, abstPct=null, abstEur=null;
    if(me){
      teiln++;
      rang=bg.findIndex(b=>b===me)+1;
      if(rang===1) siege++;
      abstPct=(me.summe-minSumme)/minSumme*100;
      abstEur=me.summe-minSumme;
      abst.push(abstPct);
    }
    chron.push({...sub, bgSorted:bg, rang, abstPct, abstEur, anzahl:bg.length, sieger:bg[0]});
  });
  const avgAbst= abst.length? abst.reduce((a,b)=>a+b,0)/abst.length : 0;
  // Trend: erste Haelfte vs zweite Haelfte des Zeitraums (Abstand sinkt = besser)
  let trend='–';
  if(abst.length>=4){
    const mid=Math.floor(abst.length/2);
    // abst ist in neueste-zuerst Reihenfolge entstanden -> juengste = vorne
    const jung=abst.slice(0,mid).reduce((a,b)=>a+b,0)/mid;
    const alt=abst.slice(mid).reduce((a,b)=>a+b,0)/(abst.length-mid);
    if(jung < alt-0.5) trend='↑ besser';
    else if(jung > alt+0.5) trend='↓ schlechter';
    else trend='→ stabil';
  }
  return {teiln, siege, quote: teiln? siege/teiln*100:0, avgAbst, trend, chron};
}

          </div>

          {profile.length===0 && <div className="ps-info">Noch keine Mitbewerber erfasst (nur eigene Angebote vorhanden).</div>}
          {profile.map((p,i)=>(
            <div className="comp-card" key={i}>
              <div className="comp-head">
                <span className="comp-name">{p.name}</span>
                <span className={"comp-ampel "+p.ampel}><span className="ad"></span>{p.ampelTxt}</span>
              </div>
              <div className="comp-stats">
                <div className="comp-stat"><div className="cv">{p.teilnahmen}×</div><div className="cl">getroffen</div></div>
                <div className="comp-stat"><div className="cv">{p.siege}×</div><div className="cl">gewonnen</div></div>
                <div className="comp-stat"><div className="cv">{p.quote.toFixed(0)}%</div><div className="cl">Quote</div></div>
              </div>
              <div className="comp-vs">
                {p.avg==null ? "Noch kein direkter Preisvergleich (keine gemeinsame Submission mit eigenem Gebot)." : (
                  <span>Bietet im Schnitt <b className={p.avg<0?"under":"over"}>{fmtPct(p.avg)}</b> {p.avg<0?'günstiger':'teurer'} als du
                  {p.std!=null && <span> · Schwankung ±{p.std.toFixed(1)}% ({p.std<5?'sehr berechenbar':p.std<12?'berechenbar':'unberechenbar'})</span>}.
                  {p.ampel==='hot' && <span> Zuletzt häufig erfolgreich – wahrscheinlich gut ausgelastet, dürfte teurer bieten oder aussetzen.</span>}
                  {p.ampel==='cold' && <span> Zuletzt ohne Zuschlag – vermutlich hungrig, dürfte aggressiv kalkulieren.</span>}
                  </span>
                )}
              </div>
            </div>
          ))}
        </div>
      )}

      {/* ===== TAB CHRONIK: kompakte Verlaufstabelle ===== */}
      {tab==="chronik" && subs.length>0 && (
        <div>
          <div className="ps-kpis">
            <div className="ps-kpi"><div className="v">{kpi.chron.length}</div><div className="l">Submissionen</div></div>
            <div className="ps-kpi green"><div className="v">{kpi.siege}</div><div className="l">gewonnen</div></div>
            <div className="ps-kpi amber"><div className="v">{fmtPct(kpi.avgAbst).replace('+','')}</div><div className="l">Ø Abstand z. Sieger</div></div>
            <div className="ps-kpi"><div className="v" style={{fontSize:'15px'}}>{kpi.trend}</div><div className="l">Trend</div></div>
          </div>
          <ChronikTabelle chron={kpi.chron}/>
          <div className="ps-info">Tippe eine Zeile an, um den vollständigen Preisspiegel der Submission zu sehen. Sortiert nach Datum, neueste zuerst.</div>
        </div>
      )}

      {/* ===== TAB ERFASSEN ===== */}
      {tab==="erfassen" && (
        <div>
          <div className="m2-section-title">Submission erfassen</div>
          <div className="ps-add">
            <div style={{marginBottom:'10px'}}>
              <button className="mini-btn blue" onClick={()=>fileRef.current.click()} style={{width:'100%',padding:'10px'}}>{'\u2191'} PDF-Niederschrift als Vorlage laden</button>
              <input ref={fileRef} type="file" accept=".pdf" style={{display:'none'}} onChange={onPdf}/>
            </div>
            <div className="ps-add-grid">
              <div className="psf"><label>Datum</label><input type="date" value={fDatum} onChange={e=>setFDatum(e.target.value)}/></div>
              <div className="psf"><label>Gewerk</label><input type="text" value={fGewerk} onChange={e=>setFGewerk(e.target.value)}/></div>
            </div>
            <div className="psf" style={{marginBottom:'12px'}}><label>Bauvorhaben</label><input type="text" value={fBv} placeholder="z.B. Sanierung Schule Musterstadt" onChange={e=>setFBv(e.target.value)}/></div>

            <div className="m2-section-title" style={{marginTop:'4px'}}>Bieter</div>
            {bidders.map((b,i)=>(
              <div className="bidder-chip" key={i}>
                <span className="bcn">{b.name}</span>
                {b.istMir && <span className="bctag tag-me">Ich</span>}
                <span className="bcs">{fmtEUR(b.summe)}</span>
                <button className="bcx" onClick={()=>rmBidder(i)}>{'\u00d7'}</button>
              </div>
            ))}
            <div className="bidder-add">
              <div className="psf"><label className="mini">Firma</label><input type="text" value={bName} placeholder="Bietername" onChange={e=>setBName(e.target.value)}/></div>
              <div className="psf"><label className="mini">Summe €</label><input type="text" value={bSumme} placeholder="0,00" onChange={e=>setBSumme(e.target.value)}/></div>
              <button className="mini-btn" onClick={()=>addBidder(false)} title="Mitbewerber">+</button>
              <button className="mini-btn blue" onClick={()=>addBidder(true)} title="Das bin ich">Ich</button>
            </div>
            <div className="ps-info">„+" fügt einen Mitbewerber hinzu, „Ich" markiert dein eigenes Gebot. Der günstigste Bieter wird automatisch als Sieger erkannt.</div>
          </div>
          <div className="weiter-wrap">
            <button className="weiter-btn" style={{background:'linear-gradient(135deg,#2ecc71,#1e9e54)',boxShadow:'0 6px 20px rgba(46,204,113,0.34)'}} onClick={saveSub}>Submission speichern</button>
          </div>
        </div>
      )}

      <div className="foot"><span className="ver">
        <span className={"dot "+(drive?"dot-on":"dot-off")}></span>Drive {drive?"verbunden":"offline"}
        <span style={{margin:"0 8px",opacity:.4}}>·</span>
        <span className={"dot "+(ki?"dot-on":"dot-off")}></span>KI {ki?"aktiv":"aus"}
      </span></div>
    </div>
  );
}

// Chronik-Tabelle mit aufklappbaren Zeilen
function ChronikTabelle({chron}){
  const [open,setOpen]=useState(null);
  function rangCls(r,n){ if(r===1)return"r1"; if(r&&r<=Math.ceil(n/2))return"rmid"; return"rlow"; }
  function abstCls(p){ if(p==null)return""; if(p<0.01)return"win"; if(p<5)return"near"; return"far"; }
  return (
    <div className="chron-tbl">
      <div className="chron-hd">
        <span>Datum</span><span>Bauvorhaben</span><span style={{textAlign:'center'}}>Rang</span><span style={{textAlign:'right'}}>z. Sieger</span><span></span>
      </div>
      {chron.map((c,i)=>{
        const isOpen=open===i;
        const datum=c.datum? c.datum.split('-').reverse().slice(0,2).join('.') : '–';
        return (
          <div className="chron-row" key={c.id||i}>
            <div className="chron-main" onClick={()=>setOpen(isOpen?null:i)}>
              <span className="chron-date">{datum}</span>
              <span className="chron-bv" title={c.bv}>{c.bv||'—'}</span>
              <span className={"chron-rang "+rangCls(c.rang,c.anzahl)}>{c.rang? c.rang+'/'+c.anzahl : '–'}</span>
              <span className={"chron-abst "+abstCls(c.abstPct)}>{c.abstPct==null?'—':(c.abstPct<0.01?'Sieg':fmtPct(c.abstPct))}</span>
              <span className="chron-exp">{isOpen?'\u2212':'+'}</span>
            </div>
            {isOpen && (
              <div className="chron-detail"><div className="chron-detail-inner">
                {c.bgSorted.map((b,bi)=>(
                  <div className={"cd-bidder"+(b.istMir?" me":"")+(bi===0?" winner":"")} key={bi}>
                    <span className="cbn">{bi+1}. {b.name}
                      {b.istMir && <span className="cd-badge me">Ich</span>}
                      {bi===0 && <span className="cd-badge winner">Sieger</span>}
                    </span>
                    <span className="cbs">{fmtEUR(b.summe)}</span>
                  </div>
                ))}
              </div></div>
            )}
          </div>
        );
      })}
    </div>
  );
}



// ============ DRIVE-WORKFLOW (dockt an window.GoogleDriveService der Suite an) ============
// Die fünf Ordner mit den EXAKTEN Namen aus dem Betrieb. Reihenfolge = Workflow-Logik.
const DRIVE_FOLDERS = [
  {key:"eingang_analyse", name:"Eingangsordner für Angebotsanalyse", dir:"in",
   role:"Rohe LVs + Dateien landen hier. Müssen noch durch die KI-Analyse.",
   actions:[{id:"list",label:"Inhalt anzeigen",style:"ghost",ico:"ti"}]},
  {key:"ausgang_analyse", name:"Ausgangsordner für Angebotsanalyse", dir:"out",
   role:"Fertige Analyse. Die App holt sich hier die Daten zur Weiterverarbeitung.",
   actions:[{id:"import",label:"Analyse einlesen",style:"blue",ico:"dl"}]},
  {key:"ausgang_ausschreibung", name:"Ausgangsordner für Ausschreibungen", dir:"out",
   role:"Lesbares Angebots-PDF (komplettes LV, wie der Bauherr es liest).",
   actions:[{id:"pdf",label:"Lesbares PDF ablegen",style:"blue",ico:"up"}]},
  {key:"ausgang_gaeb", name:"Ausgangsordner für X83 + X84 Dateien", dir:"out",
   role:"Fertige bzw. abgegebene GAEB-Dateien als Kopie.",
   actions:[{id:"x84",label:"X84 hier ablegen",style:"blue",ico:"up"}]},
  {key:"ergebnis", name:"Ergebnis Ordner", dir:"res",
   role:"Periodischer Bericht (z. B. monatlich) mit den fertigen Auswertungen.",
   actions:[{id:"bericht",label:"Bericht erzeugen",style:"green",ico:"rep"}]},
];

function driveVerfuegbar(){
  return typeof window!=="undefined" && window.GoogleDriveService && window.GoogleDriveService.accessToken;
}

function DriveScreen({lv,zuschlag,subs,drive,ki,onBack}){
  const [open,setOpen]=useState(null);
  const [bv,setBv]=useState(lv? (lv.prj||"") : "");
  const [msg,setMsg]=useState("");
  const verbunden = drive || driveVerfuegbar();

  function faIcon(ico){
    const p={width:15,height:15,viewBox:"0 0 24 24",fill:"none",xmlns:"http://www.w3.org/2000/svg"};
    if(ico==="dl") return <svg {...p}><path d="M12 3v12M12 15l-4-4M12 15l4-4M5 19h14" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>;
    if(ico==="up") return <svg {...p}><path d="M12 15V3M12 3l-4 4M12 3l4 4M5 19h14" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>;
    if(ico==="rep") return <svg {...p}><rect x="5" y="3" width="14" height="18" rx="2" stroke="white" strokeWidth="2"/><line x1="8" y1="8" x2="16" y2="8" stroke="white" strokeWidth="1.6"/><line x1="8" y1="12" x2="16" y2="12" stroke="white" strokeWidth="1.6"/><line x1="8" y1="16" x2="12" y2="16" stroke="white" strokeWidth="1.6"/></svg>;
    return <svg {...p}><path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>;
  }
  function folderIco(dir){
    const p={width:20,height:20,viewBox:"0 0 24 24",fill:"none",xmlns:"http://www.w3.org/2000/svg"};
    const col = dir==="in"?"#f39c12":dir==="res"?"#2ecc71":"#4da6ff";
    return <svg {...p}><path d="M3 7a1 1 0 011-1h5l1.5 2H20a1 1 0 011 1v9a1 1 0 01-1 1H4a1 1 0 01-1-1V7z" stroke={col} strokeWidth="2" strokeLinejoin="round"/></svg>;
  }

  function doAction(folder, act){
    // Lesbares PDF -> echte Erzeugung (geht auch offline, reiner Download als Fallback)
    if(act.id==="pdf"){ erzeugeLesbaresPDF(lv, zuschlag, verbunden, setMsg); return; }
    if(act.id==="bericht"){ erzeugeBericht(subs, lv, zuschlag, verbunden, setMsg); return; }
    if(!verbunden){
      setMsg("Google Drive ist in dieser Vorschau noch nicht verbunden. Beim Einbau in die TW Business Suite nutzt dieses Modul automatisch die dortige Drive-Anmeldung – dann liest/schreibt es direkt in „"+folder.name+"\".");
      return;
    }
    setMsg("Aktion „"+act.label+"\" für „"+folder.name+"\" wird über die Drive-Anbindung der Suite ausgeführt.");
  }

  return (
    <div className="page-container">
      <div className="back-row"><button className="back-btn" onClick={onBack}>{'\u2190'} Modul wählen</button></div>
      <div className="head"><div className="head-logo-scale"><FirmenLogo/></div>
        <div className="head-title">Ablage</div><div className="head-sub">Google Drive · Ausschreibungen</div></div>

      <div className={"dr-status "+(verbunden?"on":"off")}>
        <span className="sd"></span>
        <span className="stxt">{verbunden
          ? "Mit Google Drive verbunden – Lesen und Schreiben in deine Ordner aktiv."
          : "Drive in dieser Vorschau nicht verbunden. In der Suite dockt das Modul automatisch an die dortige Drive-Anmeldung an."}</span>
      </div>

      <div className="dr-path"><span>Drive</span>{'\u203a'}<span className="seg">Ausschreibungen</span></div>

      {DRIVE_FOLDERS.map((f,i)=>{
        const isOpen=open===i;
        return (
          <div className="folder-card" key={f.key}>
            <div className="folder-head" onClick={()=>setOpen(isOpen?null:i)}>
              <span className={"folder-ico "+f.dir}>{folderIco(f.dir)}</span>
              <span className="folder-meta">
                <span className="folder-name">{f.name}</span>
                <span className="folder-role">{f.role}</span>
              </span>
              <span className={"folder-dir "+(f.dir==="in"?"fd-in":f.dir==="res"?"fd-res":"fd-out")}>{f.dir==="in"?"Eingang":f.dir==="res"?"Bericht":"Ausgang"}</span>
            </div>
            {isOpen && (
              <div className="folder-body">
                <div className="folder-actions">
                  {f.actions.map(act=>(
                    <button key={act.id} className={"fa-btn "+act.style} onClick={()=>doAction(f,act)}>
                      {faIcon(act.ico)} {act.label}
                    </button>
                  ))}
                </div>
              </div>
            )}
          </div>
        );
      })}

      {msg && <div className="exp-done" style={{marginTop:'12px'}}>{msg}</div>}

      <div className="ps-info" style={{marginTop:'14px'}}>
        Die Ordnernamen entsprechen exakt deiner Drive-Struktur unter „Ausschreibungen". Lesbares PDF und Bericht kannst du schon jetzt erzeugen (Download); das automatische Ablegen in Drive aktiviert sich beim Einbau in die Suite.
      </div>

      <div className="foot"><span className="ver">
        <span className={"dot "+(verbunden?"dot-on":"dot-off")}></span>Drive {verbunden?"verbunden":"offline"}
        <span style={{margin:"0 8px",opacity:.4}}>·</span>
        <span className={"dot "+(ki?"dot-on":"dot-off")}></span>KI {ki?"aktiv":"aus"}
      </span></div>
    </div>
  );
}

// --- Lesbares LV-PDF erzeugen (komplettes LV als Angebot, menschenlesbar) ---
function erzeugeLesbaresPDF(lv, zuschlag, verbunden, setMsg){
  if(!lv || !lv.positionen){ setMsg("Kein LV geladen – bitte zuerst im Modul „Import\" ein LV einlesen."); return; }
  let html = '<html><head><meta charset="utf-8"><style>'
    + 'body{font-family:Arial,sans-serif;color:#1a1a1a;margin:40px;font-size:12px;}'
    + 'h1{font-size:18px;border-bottom:2px solid #c41e1e;padding-bottom:6px;}'
    + '.grp{background:#f0f0f0;font-weight:bold;padding:6px 8px;margin-top:14px;font-size:13px;}'
    + 'table{width:100%;border-collapse:collapse;margin-top:4px;}'
    + 'th,td{border-bottom:1px solid #ddd;padding:5px 6px;text-align:left;font-size:11px;vertical-align:top;}'
    + 'td.r{text-align:right;white-space:nowrap;}'
    + '.sum{font-weight:bold;font-size:14px;text-align:right;margin-top:16px;border-top:2px solid #c41e1e;padding-top:8px;}'
    + '</style></head><body>';
  html += '<h1>Angebot – '+(lv.prj||'Leistungsverzeichnis')+'</h1>';
  let gesamt=0;
  (lv.groups||[]).forEach(g=>{
    html += '<div class="grp">'+g.lbl+'</div><table><tr><th>Pos</th><th>Leistung</th><th>Menge</th><th>EP</th><th>GP</th></tr>';
    g.items.forEach(it=>{
      const pos=(lv.positionen||[]).find(p=>p.oz===it.oz)||{};
      const ep = pos.typ==='bid'?0:calcEP(pos,zuschlag);
      const gp = (pos.qty||0)*ep; gesamt+=gp;
      html += '<tr><td>'+it.oz+'</td><td>'+(it.kurz||'')+'</td><td class="r">'+(pos.qty||0).toLocaleString('de-DE')+' '+(it.qu||'')+'</td><td class="r">'+(ep>0?fmtEUR(ep):'–')+'</td><td class="r">'+(ep>0?fmtEUR(gp):'–')+'</td></tr>';
    });
    html += '</table>';
  });
  html += '<div class="sum">Angebotssumme netto: '+fmtEUR(gesamt)+'</div></body></html>';
  const w = window.open('', '_blank');
  if(w){ w.document.write(html); w.document.close(); setMsg(verbunden?"Lesbares PDF erzeugt. In der Suite wird es zusätzlich automatisch in „Ausgangsordner für Ausschreibungen\" abgelegt. Im Druckdialog „Als PDF speichern\" wählen.":"Lesbares PDF in neuem Tab geöffnet – im Druckdialog „Als PDF speichern\" wählen."); }
  else setMsg("Bitte Pop-ups erlauben, damit das PDF geöffnet werden kann.");
}

// --- Periodischer Bericht (Auswertung) erzeugen ---
function erzeugeBericht(subs, lv, zuschlag, verbunden, setMsg){
  const k = gesamtKennzahlen(subs||[]);
  const profile = analysiereWettbewerb(subs||[]);
  let html = '<html><head><meta charset="utf-8"><style>'
    + 'body{font-family:Arial,sans-serif;color:#1a1a1a;margin:40px;font-size:12px;}'
    + 'h1{font-size:18px;border-bottom:2px solid #c41e1e;padding-bottom:6px;}'
    + 'h2{font-size:14px;margin-top:20px;color:#1565C0;}'
    + 'table{width:100%;border-collapse:collapse;margin-top:6px;}'
    + 'th,td{border-bottom:1px solid #ddd;padding:5px 7px;text-align:left;font-size:11px;}'
    + '.kpis{display:flex;gap:20px;margin:12px 0;}'
    + '.kpi{background:#f0f0f0;border-radius:8px;padding:10px 14px;}'
    + '.kpi b{font-size:18px;display:block;}'
    + '</style></head><body>';
  const heute = new Date().toLocaleDateString('de-DE');
  html += '<h1>Auswertungsbericht – Stand '+heute+'</h1>';
  html += '<div class="kpis"><div class="kpi"><b>'+k.teiln+'</b>Teilnahmen</div><div class="kpi"><b>'+k.siege+'</b>Zuschläge</div><div class="kpi"><b>'+k.quote.toFixed(0)+'%</b>Trefferquote</div><div class="kpi"><b>'+k.avgAbst.toFixed(1)+'%</b>Ø Abstand</div></div>';
  html += '<h2>Mitbewerber-Profile</h2><table><tr><th>Firma</th><th>Teiln.</th><th>Siege</th><th>Quote</th><th>Ø zu uns</th><th>Status</th></tr>';
  profile.forEach(p=>{ html += '<tr><td>'+p.name+'</td><td>'+p.teilnahmen+'</td><td>'+p.siege+'</td><td>'+p.quote.toFixed(0)+'%</td><td>'+(p.avg==null?'–':(p.avg>0?'+':'')+p.avg.toFixed(1)+'%')+'</td><td>'+p.ampelTxt+'</td></tr>'; });
  html += '</table>';
  html += '<h2>Submissions-Chronik</h2><table><tr><th>Datum</th><th>Bauvorhaben</th><th>Rang</th><th>z. Sieger</th></tr>';
  k.chron.forEach(c=>{ html += '<tr><td>'+(c.datum||'')+'</td><td>'+(c.bv||'')+'</td><td>'+(c.rang?c.rang+'/'+c.anzahl:'–')+'</td><td>'+(c.abstPct==null?'–':(c.abstPct<0.01?'Sieg':'+'+c.abstPct.toFixed(1)+'%'))+'</td></tr>'; });
  html += '</table></body></html>';
  if((subs||[]).length===0){ setMsg("Noch keine Submissionen erfasst – im Modul „Preisspiegel\" Daten eingeben, dann lässt sich ein Bericht erzeugen."); return; }
  const w = window.open('', '_blank');
  if(w){ w.document.write(html); w.document.close(); setMsg(verbunden?"Bericht erzeugt. In der Suite wird er automatisch im „Ergebnis Ordner\" abgelegt. Im Druckdialog „Als PDF speichern\" wählen.":"Bericht in neuem Tab geöffnet – im Druckdialog „Als PDF speichern\" wählen."); }
  else setMsg("Bitte Pop-ups erlauben, damit der Bericht geöffnet werden kann.");
}


function App(){
  const [page,setPage]=useState("start");
  const [drive,setDrive]=useState(false);
  const [ki,setKi]=useState(false);
  const [apiKey,setApiKey]=useState("");
  const [lv,setLv]=useState(null);
  const [zuschlag,setZuschlag]=useState({mittellohn:18.50, lohnZuschlag:131, materialZuschlag:15, geraeteZuschlag:10});
  const [subs,setSubs]=useState([]);
  if(page==="start") return <StartScreen drive={drive} setDrive={setDrive} ki={ki} setKi={setKi} apiKey={apiKey} setApiKey={setApiKey} onWeiter={()=>setPage("modul")} />;
  if(page==="material") return <MaterialScreen lv={lv} setLv={setLv} zuschlag={zuschlag} setZuschlag={setZuschlag} drive={drive} ki={ki} onBack={()=>setPage("modul")} onOpenKalk={()=>setPage("kalk")} />;
  if(page==="kalk") return <KalkulationScreen lv={lv} setLv={setLv} zuschlag={zuschlag} drive={drive} ki={ki} onBack={()=>setPage("modul")} onOpenExport={()=>setPage("export")} />;
  if(page==="export") return <ExportScreen lv={lv} zuschlag={zuschlag} drive={drive} ki={ki} onBack={()=>setPage("modul")} />;
  if(page==="preisspiegel") return <PreisspiegelScreen subs={subs} setSubs={setSubs} drive={drive} ki={ki} onBack={()=>setPage("modul")} />;
  if(page==="drive") return <DriveScreen lv={lv} zuschlag={zuschlag} subs={subs} drive={drive} ki={ki} onBack={()=>setPage("modul")} />;
  return <ModulScreen drive={drive} ki={ki} lv={lv} setLv={setLv} onOpenMaterial={()=>setPage("material")} onOpenKalk={()=>setPage("kalk")} onOpenExport={()=>setPage("export")} onOpenPreisspiegel={()=>setPage("preisspiegel")} onOpenDrive={()=>setPage("drive")} onBack={()=>setPage("start")} />;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
